
services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # Run as the host user so files written on the bind mount (var/, including the
    # SQLite database) stay owned by you instead of root. Override with
    # DOCKER_UID/DOCKER_GID (`id -u`/`id -g`) if your host user isn't 1000:1000.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - .:/var/www/html:cached
    environment:
      APP_ENV: ${APP_ENV:-dev}

  nginx:
    image: nginx:alpine
    ports:
      # No fixed host port: several projects on this machine already bind 8080.
      # Find the assigned port with: docker compose port nginx 80
      - "80"
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
